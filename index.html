* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--ivory); }
body { height: 100%; margin: 0; background: var(--ivory); color: var(--navy); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--burgundy); outline-offset: 3px; }

/* Pattern ground */
.ground { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: var(--pattern); background-size: 52px auto; opacity: .16; transition: opacity .8s var(--ease);
  -webkit-mask-image: radial-gradient(120% 70% at 50% 0%, #000 30%, transparent 85%); mask-image: radial-gradient(120% 70% at 50% 0%, #000 30%, transparent 85%); }
body[data-screen="question"] .ground, body[data-screen="gate"] .ground, body[data-screen="details"] .ground, body[data-screen="register"] .ground { opacity: .06; }

/* Hero road (intro only) */
.hero-road { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; transition: opacity .7s var(--ease);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.15) 0%, rgba(0,0,0,.2) 26%, #000 46%, #000 72%, rgba(0,0,0,.18) 88%); mask-image: linear-gradient(to bottom, rgba(0,0,0,.15) 0%, rgba(0,0,0,.2) 26%, #000 46%, #000 72%, rgba(0,0,0,.18) 88%); }
.hero-road.dim { opacity: 0; }
.hr-edge { fill: none; stroke: var(--road-edge); stroke-width: 96; stroke-linecap: round; }
.hr-body { fill: none; stroke: var(--road); stroke-width: 90; stroke-linecap: round; }
.hr-dash { fill: none; stroke: var(--burgundy); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 16 22; animation: drive 1.4s linear infinite; opacity: .75; }
@keyframes drive { to { stroke-dashoffset: -38; } }

/* App frame */
.app { position: relative; z-index: 2; max-width: 540px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 28px; }
.topbar { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 4px 12px; padding-top: 4px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--navy); display: grid; place-items: center; cursor: pointer; transition: border-color .2s, background .2s; padding: 0; }
.icon-btn:hover { border-color: var(--line-strong); }
.icon-btn.is-off { visibility: hidden; }
.tb-label { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.tb-brand { font-family: var(--f-display); font-size: 13px; font-weight: 600; }
.tb-step { font-family: var(--f-mono); font-size: 11px; color: var(--navy-soft); text-transform: uppercase; letter-spacing: .12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-flag { font-family: var(--f-display); font-size: 12px; font-weight: 700; color: var(--on-accent); background: var(--burgundy); padding: 5px 15px 4px 9px; clip-path: polygon(0 0, 100% 0, 85% 50%, 100% 100%, 0 100%); }
.progress { grid-column: 1 / -1; position: relative; height: 34px; margin-top: 2px; }
.progress svg.track { position: absolute; left: 0; right: 0; top: 5px; display: block; width: 100%; height: 24px; overflow: visible; }
#pBase { fill: none; stroke: var(--sand); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; opacity: .7; }
#pFill { fill: none; stroke: var(--burgundy); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); }
.p-mz { position: absolute; left: 0; top: 50%; width: 30px; height: 34px; margin: -22px 0 0 -15px; transition: left .8s var(--ease), top .8s var(--ease); filter: drop-shadow(0 3px 4px var(--shadow)); }
.p-mz svg { width: 100%; height: 100%; display: block; overflow: visible; }
.p-mz.hop svg { animation: pHop .5s var(--spring); }
@keyframes pHop { 0% { transform: translateY(0); } 40% { transform: translateY(-9px) rotate(-6deg); } 100% { transform: none; } }

.stage { position: relative; flex: 1; display: flex; flex-direction: column; margin-top: 14px; }
.screen { display: flex; flex-direction: column; gap: 20px; flex: 1; }
.screen.leaving { position: absolute; inset: 0 0 auto 0; }
.head { display: grid; gap: 8px; }
.h2 { font-family: var(--f-display); font-size: clamp(23px, 6.4vw, 28px); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.h2:focus, .q-text:focus, .display:focus { outline: none; }
.sub { color: var(--navy-soft); margin: 0; font-size: 15px; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px/1 var(--f-body); border-radius: 16px; padding: 0 22px; min-height: 56px; border: 0; cursor: pointer; transition: transform .15s, box-shadow .25s, background .2s; text-decoration: none; }
.btn.primary { background: var(--burgundy); color: var(--on-accent); box-shadow: 0 14px 28px -16px var(--burgundy); }
.btn.primary:hover { background: var(--burgundy-hi); }
.btn.ghost { background: var(--paper); color: var(--navy); border: 1px solid var(--line-strong); }
.btn.ghost:hover { border-color: var(--navy-soft); }
.btn:active { transform: scale(.98); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .6; cursor: progress; }

/* Logos */
.lockup { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lockup img { display: block; width: auto; max-width: 100%; }
.lockup .lk-dm { height: 28px; }
.lockup .lk-fe { height: 40px; }
.lockup i { width: 1px; height: 32px; background: var(--sand); opacity: .7; }
.lockup.sm .lk-dm { height: 22px; }
.lockup.sm .lk-fe { height: 31px; }
.lockup.sm i { height: 24px; }

/* Mumtaz the Falcon */
.mz { position: relative; }
.mz-svg { display: block; width: 100%; height: auto; overflow: visible; }
.mz-svg g { transform-box: view-box; }
.mz-rig { transform-origin: 600px 860px; }
.mz-p { transition: opacity .18s linear, transform .45s var(--ease); }
.mz-wl { transform-origin: 500px 390px; transform: rotate(-35deg); opacity: 0; }
.mz-wr { transform-origin: 700px 390px; transform: rotate(35deg); opacity: 0; }
.mz-fl { transform-origin: 488px 380px; }
.mz-fr { transform-origin: 712px 380px; }
.mz-head { transform-origin: 600px 330px; transition: transform .45s var(--ease); }
.mz-head use { opacity: 0; }
.mz[data-face="base"] .f-base, .mz[data-face="blink"] .f-blink, .mz[data-face="talk"] .f-talk, .mz[data-face="look"] .f-look { opacity: 1; }
.mz[data-face="look"] .mz-head { transform: rotate(4deg); }

.mz[data-pose="wave"] .mz-fr, .mz[data-pose="present"] .mz-fr,
.mz[data-pose="open"] .mz-fl, .mz[data-pose="open"] .mz-fr,
.mz[data-pose="flap"] .mz-fl, .mz[data-pose="flap"] .mz-fr,
.mz[data-pose="cheer"] .mz-fl, .mz[data-pose="cheer"] .mz-fr { opacity: 0; }
.mz[data-pose="wave"] .mz-wr, .mz[data-pose="present"] .mz-wr,
.mz[data-pose="open"] .mz-wl, .mz[data-pose="open"] .mz-wr,
.mz[data-pose="flap"] .mz-wl, .mz[data-pose="flap"] .mz-wr,
.mz[data-pose="cheer"] .mz-wl, .mz[data-pose="cheer"] .mz-wr { opacity: 1; }

.mz[data-pose="rest"] .mz-rig { animation: mzBob 3.6s ease-in-out infinite; }
.mz[data-pose="rest"] .mz-fl { animation: mzSwayL 3.6s ease-in-out infinite; }
.mz[data-pose="rest"] .mz-fr { animation: mzSwayR 3.6s ease-in-out infinite; }
.mz[data-pose="wave"] .mz-wr { animation: mzWave 1s ease-in-out infinite alternate; }
.mz[data-pose="wave"] .mz-rig { animation: mzBob 3s ease-in-out infinite; }
.mz[data-pose="present"] .mz-wr { animation: mzPresent 2.2s ease-in-out infinite alternate; }
.mz[data-pose="present"] .mz-rig { animation: mzBob 3.4s ease-in-out infinite; }
.mz[data-pose="open"] .mz-wl { animation: mzOpenL 2.4s ease-in-out infinite alternate; }
.mz[data-pose="open"] .mz-wr { animation: mzOpenR 2.4s ease-in-out infinite alternate; }
.mz[data-pose="flap"] .mz-wl { animation: mzFlapL .34s ease-in-out infinite alternate; }
.mz[data-pose="flap"] .mz-wr { animation: mzFlapR .34s ease-in-out infinite alternate; }
.mz[data-pose="flap"] .mz-rig { animation: mzHover 1.2s ease-in-out infinite; }
.mz[data-pose="cheer"] .mz-wl { animation: mzCheerL .42s ease-in-out infinite alternate; }
.mz[data-pose="cheer"] .mz-wr { animation: mzCheerR .42s ease-in-out infinite alternate; }
.mz[data-pose="cheer"] .mz-rig { animation: mzHop .84s ease-in-out infinite; }
@keyframes mzBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes mzHover { 0%, 100% { transform: translateY(-6px); } 50% { transform: translateY(-26px); } }
@keyframes mzHop { 0%, 100% { transform: translateY(0) scale(1, 1); } 12% { transform: translateY(0) scale(1.03, .95); } 50% { transform: translateY(-34px) scale(.98, 1.03); } }
@keyframes mzSwayL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
@keyframes mzSwayR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
@keyframes mzWave { from { transform: rotate(-30deg); } to { transform: rotate(-62deg); } }
@keyframes mzPresent { from { transform: rotate(2deg); } to { transform: rotate(12deg); } }
@keyframes mzOpenL { from { transform: rotate(-35deg); } to { transform: rotate(-26deg); } }
@keyframes mzOpenR { from { transform: rotate(35deg); } to { transform: rotate(26deg); } }
@keyframes mzFlapL { from { transform: rotate(-40deg); } to { transform: rotate(26deg); } }
@keyframes mzFlapR { from { transform: rotate(40deg); } to { transform: rotate(-26deg); } }
@keyframes mzCheerL { from { transform: rotate(14deg); } to { transform: rotate(36deg); } }
@keyframes mzCheerR { from { transform: rotate(-14deg); } to { transform: rotate(-36deg); } }

.say { position: relative; background: var(--paper); border: 1px solid var(--sand-100); border-radius: 18px; padding: 11px 14px 10px; font-size: 14.5px; line-height: 1.4; color: var(--navy); box-shadow: 0 10px 24px -18px var(--shadow); min-height: 44px; transform-origin: 100% 50%; }
.say::after { content: ""; position: absolute; right: -8px; top: 50%; width: 14px; height: 14px; margin-top: -7px; background: var(--paper); border-right: 1px solid var(--sand-100); border-top: 1px solid var(--sand-100); transform: rotate(45deg); }
.say b { color: var(--burgundy); font-weight: 600; }
.say.down { transform-origin: 50% 100%; text-align: center; }
.say.down::after { right: auto; left: 50%; top: auto; bottom: -8px; margin: 0 0 0 -7px; transform: rotate(135deg); }
.say.pop { animation: sayPop .45s var(--spring); }
@keyframes sayPop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
.mz-row { display: grid; grid-template-columns: minmax(0, 1fr) 128px; align-items: center; gap: 12px; }
.mz-row .mz { width: 128px; }
.mz-row.md { grid-template-columns: minmax(0, 1fr) 150px; }
.mz-row.md .mz { width: 150px; }

.stars { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.stars svg { position: absolute; left: 50%; top: 40%; width: 16px; height: 16px; margin: -8px; }

/* Intro */
.s-intro { justify-content: space-between; gap: 18px; }
.intro-copy { display: grid; gap: 0; padding-top: 1vh; }
.intro-copy .lockup { margin-bottom: 22px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--sand-ink); margin: 0 0 12px; }
.display { font-family: var(--f-display); font-weight: 700; font-size: clamp(38px, 11vw, 58px); line-height: 1.02; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.display .yr { color: var(--burgundy); }
.lede { font-size: 17px; line-height: 1.45; color: var(--navy-soft); max-width: 32ch; margin: 14px 0 0; }
.intro-mz { position: relative; display: grid; justify-items: center; }
.intro-mz .mz { width: min(300px, 78vw); }
.intro-mz .say { position: absolute; left: 0; top: -6px; max-width: 42%; z-index: 2; font-size: 14px; }
.intro-foot { display: grid; gap: 14px; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; list-style: none; padding: 0; margin: 0; }
.facts li { font-size: 13px; color: var(--navy-soft); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--paper); }
.facts b { color: var(--navy); font-weight: 600; }
.fine { font-size: 12.5px; color: var(--navy-soft); margin: 0; line-height: 1.45; }
.s-intro .intro-copy > *, .s-intro .intro-foot > * { animation: rise .7s var(--ease) both; }
.s-intro .display { animation-delay: .06s; }
.s-intro .lede { animation-delay: .12s; }
.s-intro .intro-foot > :nth-child(1) { animation-delay: .5s; }
.s-intro .intro-foot > :nth-child(2) { animation-delay: .56s; }
.s-intro .intro-foot > :nth-child(3) { animation-delay: .62s; }

/* Category */
.cats { display: grid; gap: 10px; }
.cat { display: grid; grid-template-columns: 48px 1fr 18px; align-items: center; gap: 14px; text-align: left; padding: 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; transition: border-color .2s, background .2s, transform .15s, box-shadow .2s; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 60ms + 120ms); }
.cat:hover { border-color: var(--line-strong); box-shadow: 0 10px 22px -18px var(--shadow); }
.cat:active { transform: scale(.985); }
.cat.selected { border-color: var(--burgundy); background: var(--burgundy-soft); }
.cat .ico { width: 48px; height: 48px; border-radius: 14px; background: var(--sand-50); display: grid; place-items: center; color: var(--burgundy); }
.cat-txt { display: grid; gap: 2px; min-width: 0; }
.cat-txt b { font-size: 16.5px; font-weight: 600; }
.cat-txt small { color: var(--navy-soft); font-size: 13.5px; }
.wbar { display: flex; gap: 2px; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 8px; }
.wbar i { display: block; height: 100%; }
.chev { color: var(--navy-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; font-size: 12px; color: var(--navy-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
:root { --p1: #872c3b; --p2: #b5596a; --p3: #a28d60; --p4: #353f56; --p5: #8d95a8; }

/* Forms */
.form { display: grid; gap: 18px; }
.field { display: grid; gap: 7px; border: 0; padding: 0; margin: 0; min-width: 0; }
.lbl { font-size: 13.5px; font-weight: 600; color: var(--navy); padding: 0; }
.input { font: 400 17px/1.3 var(--f-body); color: var(--navy); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 14px; padding: 14px; min-height: 52px; width: 100%; transition: border-color .2s, box-shadow .2s; }
textarea.input { min-height: 96px; resize: vertical; }
.input:focus { outline: none; border-color: var(--burgundy); box-shadow: 0 0 0 4px var(--burgundy-soft); }
.input::placeholder { color: var(--navy-faint); }
.field.bad .input { border-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; }
.err:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; min-height: 42px; padding: 2px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--paper); font-size: 14.5px; font-weight: 500; color: var(--navy); transition: background .2s, color .2s, border-color .2s; }
.chip input:checked + span { background: var(--burgundy); color: var(--on-accent); border-color: var(--burgundy); }
.chip input:focus-visible + span { outline: 2px solid var(--burgundy); outline-offset: 2px; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; font-size: 14px; line-height: 1.45; color: var(--navy-soft); cursor: pointer; }
.check input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line-strong); background: var(--paper); display: grid; place-items: center; margin: 0; cursor: pointer; transition: background .2s, border-color .2s; }
.check input:checked { background: var(--burgundy); border-color: var(--burgundy); }
.check input:checked::after { content: ""; width: 11px; height: 6px; border: 2.5px solid var(--on-accent); border-top: 0; border-right: 0; transform: translate(0, -2px) rotate(-45deg); }
.check.bad input { border-color: var(--danger); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* Questions */
.q-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pill-chip { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sand-ink); background: var(--sand-50); border: 1px solid var(--sand-100); padding: 5px 10px 4px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cid { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--burgundy); border: 1px solid var(--burgundy-line); padding: 3px 8px 2px; border-radius: 8px; white-space: nowrap; flex: none; background: var(--paper); }
.pbanner { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--paper); border: 1px solid var(--sand-100); animation: rise .55s var(--ease) both; }
.pbanner::before { content: ""; position: absolute; inset: 0; background-image: var(--pattern); background-size: 40px auto; opacity: .18; -webkit-mask-image: linear-gradient(90deg, transparent 35%, #000); mask-image: linear-gradient(90deg, transparent 35%, #000); }
.pbanner > * { position: relative; }
.pbanner .pb-n { font-family: var(--f-display); font-size: 30px; font-weight: 700; color: var(--burgundy); line-height: 1; }
.pbanner b { display: block; font-size: 15.5px; font-weight: 600; }
.pbanner small { color: var(--navy-soft); font-size: 13px; }
.q-crit { margin: 0; font-size: 13.5px; line-height: 1.35; color: var(--navy-soft); font-weight: 500; min-width: 0; }
.q-meta + .q-meta, .q-meta + .q-text { margin-top: -6px; }
.q-text { font-family: var(--f-display); font-weight: 600; font-size: clamp(21px, 5.8vw, 25px); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.q-help { margin: -8px 0 0; color: var(--navy-soft); font-size: 14.5px; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 15px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper); font: 400 15.5px/1.42 var(--f-body); cursor: pointer; transition: border-color .2s, background .2s, transform .15s, box-shadow .2s; animation: rise .45s var(--ease) both; animation-delay: calc(var(--i) * 55ms + 60ms); }
.opt:hover { border-color: var(--line-strong); box-shadow: 0 10px 22px -18px var(--shadow); }
.opt:active { transform: scale(.985); }
.opt.selected { border-color: var(--burgundy); background: var(--burgundy-soft); box-shadow: inset 0 0 0 1px var(--burgundy); }
.sig { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
.sig i { width: 4px; border-radius: 2px; background: var(--sand-100); }
.sig i:nth-child(1) { height: 6px; } .sig i:nth-child(2) { height: 10px; } .sig i:nth-child(3) { height: 14px; } .sig i:nth-child(4) { height: 18px; }
.sig i.on { background: var(--sand); }
.opt.selected .sig i.on { background: var(--burgundy); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; }
.opt.selected .radio { border-color: var(--burgundy); }
.opt.selected .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--burgundy); }
.unsure { align-self: center; background: none; border: 0; color: var(--navy-soft); font: 500 14.5px var(--f-body); text-decoration: underline; text-underline-offset: 4px; padding: 10px 14px; cursor: pointer; border-radius: 10px; }
.unsure:hover { color: var(--navy); }
.unsure.selected { color: var(--burgundy); }

/* Computing */
.s-comp { justify-content: center; align-items: center; text-align: center; }
.comp-wrap { display: grid; justify-items: center; gap: 10px; }
.comp-wrap .mz { width: 220px; }
.comp-road { width: 240px; height: 70px; margin-top: -10px; }
.cr-base { fill: none; stroke: var(--road); stroke-width: 18; stroke-linecap: round; }
.cr-run { fill: none; stroke: var(--burgundy); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 12; animation: drive .9s linear infinite; }
.comp-line { margin: 0; font-family: var(--f-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--navy-soft); min-height: 1.5em; }

/* Results */
.r-top .lockup { justify-content: flex-start; }
.r-hero { position: relative; overflow: hidden; display: grid; gap: 10px; padding: 22px 20px 18px; border-radius: 22px; background: var(--paper); border: 1px solid var(--sand-100); box-shadow: 0 18px 40px -30px var(--shadow), inset 0 0 0 6px var(--paper), inset 0 0 0 7px var(--sand-100); }
.r-hero::before { content: ""; position: absolute; inset: 0; background-image: var(--pattern); background-size: 48px auto; opacity: .2; -webkit-mask-image: radial-gradient(70% 60% at 100% 0%, #000, transparent 75%); mask-image: radial-gradient(70% 60% at 100% 0%, #000, transparent 75%); pointer-events: none; }
.r-hero > * { position: relative; }
.r-eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--sand-ink); margin: 0; overflow-wrap: anywhere; }
.score { display: flex; align-items: baseline; gap: 10px; }
.score .num { font-family: var(--f-display); font-weight: 700; font-size: clamp(76px, 23vw, 106px); line-height: .9; color: var(--burgundy); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.score .of { font-family: var(--f-display); font-size: 20px; font-weight: 500; color: var(--navy-soft); }
.stage-pill { display: inline-flex; align-items: center; font-weight: 600; font-size: 14px; padding: 5px 12px; border-radius: 999px; color: var(--ct); background: var(--paper); border: 1px solid var(--c); }
.stage-row { display: flex; }
.stage-desc { margin: 0; color: var(--navy-soft); font-size: 15px; max-width: 40ch; }
.r-road { width: 100%; height: auto; display: block; margin-top: 4px; }
.rr-base { fill: none; stroke: var(--sand-50); stroke-width: 16; stroke-linecap: round; }
.rr-fill { fill: none; stroke-width: 16; stroke-linecap: round; transition: stroke-dashoffset 1.4s var(--ease); }
.rr-dash { fill: none; stroke: var(--paper); stroke-width: 1.5; stroke-dasharray: 5 6; opacity: .9; }
.rr-post { stroke: var(--line-strong); stroke-width: 1.5; }
.rr-lbl { fill: var(--navy-soft); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .04em; text-anchor: middle; }
.rr-lbl.here { fill: var(--navy); font-weight: 600; }
.rr-flag { fill: var(--burgundy); }
.rr-flag-t { fill: var(--burgundy); font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .08em; }
.rr-marker { transition: transform 1.4s var(--ease); }
.rr-marker circle.o { fill: var(--burgundy-soft); }
.rr-marker circle.i { fill: var(--burgundy); stroke: var(--paper); stroke-width: 2; }
.rr-marker text { fill: var(--navy); font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; text-anchor: middle; letter-spacing: .08em; }
.gap-line { margin: 0; font-size: 15px; font-weight: 600; }
.gate-chip { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--navy); padding: 12px 14px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.gate-chip svg { flex: none; margin-top: 1px; }
.gate-chip.ok svg { color: var(--b-e); }
.gate-chip.warn { border-color: var(--burgundy-line); background: var(--burgundy-soft); }
.gate-chip.warn svg { color: var(--burgundy); }

.sec { display: grid; gap: 14px; margin-top: 6px; }
.sec-h { display: grid; gap: 4px; }
.sec-h h3 { font-family: var(--f-display); font-size: 19px; font-weight: 600; margin: 0; line-height: 1.2; }
.sec-h p { margin: 0; font-size: 14px; color: var(--navy-soft); }
.p-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
.p-row { display: grid; gap: 7px; }
.p-head { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; }
.p-n { font-family: var(--f-mono); font-size: 12px; color: var(--navy-soft); }
.p-name { font-weight: 600; font-size: 15px; min-width: 0; line-height: 1.3; }
.p-score { font-family: var(--f-display); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
.p-bar { position: relative; height: 10px; border-radius: 6px; background: var(--sand-50); overflow: hidden; }
.p-bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 6px; background: var(--c); transition: width 1.1s var(--ease); }
.p-bar::after { content: ""; position: absolute; inset: 0; background:
  linear-gradient(90deg, transparent calc(27.5% - 1px), var(--paper) calc(27.5% - 1px) calc(27.5% + 1px), transparent calc(27.5% + 1px)),
  linear-gradient(90deg, transparent calc(52.5% - 1px), var(--paper) calc(52.5% - 1px) calc(52.5% + 1px), transparent calc(52.5% + 1px)),
  linear-gradient(90deg, transparent calc(77.5% - 1px), var(--paper) calc(77.5% - 1px) calc(77.5% + 1px), transparent calc(77.5% + 1px)); }
.p-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--navy-soft); }
.p-foot .band { color: var(--ct); font-weight: 600; }

.plan { list-style: none; padding: 0; margin: 0; display: grid; }
.phase { position: relative; padding: 0 0 22px 32px; }
.phase::before { content: ""; position: absolute; left: 8px; top: 22px; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, var(--burgundy) 0 8px, transparent 8px 15px); opacity: .55; }
.phase:last-child { padding-bottom: 0; }
.phase:last-child::before { display: none; }
.ph-dot { position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--burgundy); background: var(--ivory); }
.phase:first-child .ph-dot { background: var(--burgundy); }
.ph-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.ph-head b { font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.ph-head span { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--sand-ink); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 14px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); }
.step > div { min-width: 0; }
.step b { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
.step p { margin: 0; font-size: 14.5px; color: var(--navy-soft); line-height: 1.45; }
.step .t-unsure { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--sand-ink); background: var(--sand-50); padding: 2px 7px 1px; border-radius: 6px; margin-bottom: 6px; }
.note { margin: 0; font-size: 14px; color: var(--navy-soft); border-left: 2px solid var(--sand); padding: 2px 0 2px 12px; }
.strengths { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.strengths li { display: inline-flex; gap: 8px; align-items: baseline; font-size: 13.5px; padding: 7px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); }
.strengths .cid { border: 0; padding: 0; font-size: 12px; background: none; }
.answers { border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
.answers summary { cursor: pointer; padding: 14px 16px; font-weight: 600; font-size: 14.5px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.answers summary::-webkit-details-marker { display: none; }
.answers summary::after { content: "+"; font-family: var(--f-mono); color: var(--burgundy); font-size: 18px; }
.answers[open] summary::after { content: "–"; }
.answers ul { list-style: none; margin: 0; padding: 0 16px 14px; display: grid; gap: 8px; }
.answers li { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; font-size: 13.5px; align-items: baseline; color: var(--navy-soft); }
.answers li span:first-child { font-family: var(--f-mono); font-size: 12px; }
.answers li b { font-size: 12.5px; color: var(--ct); white-space: nowrap; font-weight: 600; }
.mail-line { display: flex; gap: 10px; align-items: flex-start; margin: 0; font-size: 14px; color: var(--navy); padding: 12px 14px; border-radius: 14px; background: var(--sand-50); border: 1px solid var(--sand-100); overflow-wrap: anywhere; }
.mail-line svg { flex: none; color: var(--sand-ink); margin-top: 1px; }
.mail-line.warn { background: var(--burgundy-soft); border-color: var(--burgundy-line); }
.mail-line.warn svg { color: var(--burgundy); }
.cta-card { position: relative; overflow: hidden; display: grid; gap: 12px; padding: 20px; border-radius: 22px; background: var(--paper); border: 1px solid var(--burgundy-line); }
.cta-card::before { content: ""; position: absolute; inset: 0; background-image: var(--pattern); background-size: 44px auto; opacity: .14; -webkit-mask-image: linear-gradient(200deg, #000, transparent 60%); mask-image: linear-gradient(200deg, #000, transparent 60%); }
.cta-card > * { position: relative; }
.cta-card h3 { font-family: var(--f-display); font-size: 19px; font-weight: 600; margin: 0; line-height: 1.2; }
.cta-card p { margin: 0; color: var(--navy-soft); font-size: 14.5px; }
.r-foot { display: grid; gap: 12px; }
.pdf-card { display: grid; gap: 14px; padding: 18px; border-radius: 20px; background: var(--paper); border: 1px solid var(--burgundy-line); box-shadow: 0 16px 34px -28px var(--burgundy); }
.pdf-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.pdf-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--burgundy-soft); color: var(--burgundy); }
.pdf-ico svg { width: 24px; height: 24px; }
.pdf-card h3 { font-family: var(--f-display); font-size: 18px; font-weight: 600; margin: 0 0 2px; line-height: 1.2; }
.pdf-card p { margin: 0; color: var(--navy-soft); font-size: 14px; }
.pdf-status { margin: 0; font-size: 13.5px; color: var(--navy-soft); text-align: center; overflow-wrap: anywhere; }
.pdf-status:empty { display: none; }
.pdf-status a { color: var(--burgundy); font-weight: 600; }
.done-actions .btn svg { flex: none; }
.disclaimer { font-size: 12.5px; color: var(--navy-soft); margin: 0; line-height: 1.5; }

/* Register + done */
.summary { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 14px 16px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; margin: 0; }
.summary dt { color: var(--navy-soft); }
.summary dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.s-done { justify-content: center; text-align: center; align-items: center; }
.done-wrap { position: relative; display: grid; justify-items: center; gap: 14px; max-width: 36ch; width: 100%; }
.done-wrap .mz { width: 230px; }
.done-wrap p { margin: 0; color: var(--navy-soft); }
.done-actions { display: grid; gap: 10px; width: 100%; margin-top: 8px; }
.sep { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .7; margin: 0 .55em; vertical-align: .2em; position: relative; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-width: 720px) { .app { padding-block: 24px 40px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .hr-dash, .cr-run, .mz-rig, .mz-p { animation: none !important; }
}
</style>

          "It's used in parts of the operation, but review findings aren't always closed.",
          "Teams use it routinely, and audits and corrective actions lead to visible improvements.",
          "It covers nearly everything, including unusual events, and holds current accredited certification for this outlet."],
      s: ["Map the procedures you actually use, name an owner for each and start a monthly review with recorded actions.",
          "Extend the system to every shift and any shared hotel functions, and close each review finding with proof the fix worked.",
          "Use audit themes and trends to prevent repeat issues, and secure accredited food safety certification that covers this outlet.",
          "Keep certification current and build several review cycles of sustained results, including how you handled unusual events."] },
    { id: "1.2", t: "Hazard analysis and key food safety controls", k: 0,
      q: "How are your key food safety controls set and checked?",
      o: ["There's no reliable hazard analysis, and limits and checks are missing or unclear.",
          "A hazard analysis exists, but delivery, holding or menu changes aren't fully covered.",
          "Controls cover most processes, limits have a stated basis and failures lead to decisions on the food.",
          "Controls are validated across shifts, tested in busy service, and trends catch drift early."],
      s: ["Walk the flow from receiving to service, list the main hazards and set a limit, a check and a response for each.",
          "Update the analysis for delivery, holding and new dishes, and record what happens to food when a control fails.",
          "Track control trends to catch drift before incidents, and test controls under realistic busy conditions.",
          "Show a falling rate of repeat failures, and review the analysis every time the menu or a process changes."] },
    { id: "1.3", t: "Internal and supplier audits", k: 0,
      q: "How do you check your own practices and your key suppliers?",
      o: ["There are no planned checks, and supplier assurances are taken as given.",
          "Some checks happen, but frequency doesn't follow risk and findings aren't closed on time.",
          "A risk-based plan covers our site and suppliers, causes are found and fixes are verified.",
          "Audit themes reshape the plan, and repeat findings and supplier problems keep falling."],
      s: ["Set a simple audit schedule for your own kitchen and your highest-risk suppliers, and log every finding with an owner and a date.",
          "Base audit frequency on risk, find the root cause of each finding and recheck that it hasn't come back.",
          "Use audit themes and emerging risks to adjust the plan, and track repeat findings and supplier performance over time.",
          "Keep showing fewer repeat findings year on year and stronger supplier performance across shifts."] },
    { id: "1.4", t: "Leadership and food safety oversight", k: 0,
      q: "How do leaders steer food safety at this outlet?",
      o: ["Support is stated, but responsibilities, resources and follow-up aren't visible.",
          "Managers discuss food safety, but objectives and follow-up vary between shifts.",
          "Leaders set objectives, review trends and put people and equipment on the key risks.",
          "Leaders anticipate capacity and change risks, challenge weak results and check their investments worked."],
      s: ["Set three food safety objectives for this outlet, assign owners and review them in a short monthly meeting.",
          "Use the same objectives and escalation route on every shift, and track each meeting action to closure.",
          "Check whether investments and decisions actually improved results, and plan ahead for peak seasons and changes.",
          "Keep several review cycles of evidence linking leadership decisions to better controls and staff behaviour."] },
    { id: "1.5", t: "Staff learning and demonstrated competence", k: 0,
      q: "How do you know your food handlers can actually do the job safely?",
      o: ["Training is generic or undocumented, and practice isn't checked.",
          "People attend courses, but attendance is the main measure and practical checks are patchy.",
          "Each role has defined skills, and supervisors observe, coach and recheck practice.",
          "We anticipate learning needs from data and incidents, and repeat errors keep falling."],
      s: ["Define the must-have food safety skills for each role and record who has been trained on them.",
          "Add on-the-job observation checks for each role, including contractors and new tasks, and recheck after coaching.",
          "Use observations and incident themes to plan training ahead of menu or equipment changes, and measure whether it worked.",
          "Show fewer repeat errors over time, across shifts and as roles change."] },
    { id: "1.6", t: "Food safety culture and improvement", k: 1,
      q: "How do you measure and build your food safety culture?",
      o: ["Training attendance and a policy statement are our proof of culture.",
          "Some surveys or speak-up channels exist, but action is limited and staff aren't sure what happens next.",
          "Teams take part in culture measurement, leaders act on the results and we repeat the measure.",
          "Staff report openly and make safe calls under pressure, and repeated measures show improvement."],
      s: ["Run a short staff culture survey or observation round, and give staff a simple way to raise concerns.",
          "Share results with every team, agree an action plan and tell staff what happened to the concerns they raised.",
          "Repeat the measure on every shift, recognise safe behaviour and show how reporting and ownership improved.",
          "Track culture across repeated measurements and show it holds under pressure and staff turnover."] },
    { id: "1.7", t: "Allergen controls in preparation and service", k: 1,
      q: "How well are allergens controlled in preparation and service?",
      o: ["We can't reliably say which dishes contain which allergens or prevent cross-contact.",
          "Some dishes are mapped, but substitutions, shared equipment and rush periods slip through.",
          "A current allergen matrix, segregation and order checks work across normal shifts.",
          "Controls hold across every channel and rush period, and near misses are tracked and falling."],
      s: ["Build an allergen matrix for every dish and ingredient, and set clear rules for segregation and special orders.",
          "Add checks for substitutions, supplier changes and shared equipment, and verify them during busy service.",
          "Test high-risk scenarios, track near misses and supplier changes, and cover delivery and every order channel.",
          "Show a sustained fall in allergen errors and keep testing staff responses under pressure."] },
    { id: "1.8", t: "Supplier and incoming food assurance", k: 0,
      q: "How do you approve suppliers and check what arrives?",
      o: ["Deliveries are accepted without clear requirements or reliable checks.",
          "There's an approved list, but choices follow price or availability and repeat problems aren't followed up.",
          "Suppliers are approved by risk, and specifications, delivery checks and rejections are routine.",
          "We anticipate supplier risks, verify their improvements and repeat failures keep falling."],
      s: ["Create an approved supplier list with basic requirements, and check temperature, condition and identity at every delivery.",
          "Rank suppliers by food risk, write specifications for high-risk items and follow up every rejected delivery.",
          "Use supplier performance trends to adjust checks, and verify that suppliers' corrective actions worked.",
          "Show fewer repeat supplier failures and review assurance whenever products or suppliers change."] },
    { id: "1.9", t: "Cold-chain and temperature control", k: 1,
      q: "How well do you control temperatures from delivery to service?",
      o: ["Temperatures aren't reliably logged, and excursions have no clear decision on the food.",
          "Some temperatures are recorded, but shifts or units are missed and the food isn't always assessed.",
          "Limits, maintained equipment and routine checks cover most steps, and excursions are investigated.",
          "Control holds through peak demand, breakdowns and handovers, and excursions keep falling."],
      s: ["Set temperature limits for every step, log them each shift and record what happens to food after any excursion.",
          "Cover every shift and unit, calibrate thermometers on schedule, and assess the food rather than just fixing the fridge.",
          "Review trends to spot failing equipment early, and plan for breakdowns, peak demand and handovers.",
          "Show a sustained drop in excursions and fewer cases where the fate of the food was uncertain."] },
    { id: "1.10", t: "Incident response and recall readiness", k: 0,
      q: "If a food safety incident happened today, how ready are you?",
      o: ["There's no workable plan, so staff wouldn't know which food is affected or who to call.",
          "A procedure exists, but tests show delays, gaps in tracing or unclear food decisions.",
          "Roles, containment and communication are clear, and we've run a timed withdrawal test.",
          "We rehearse difficult scenarios across shifts, and our response keeps getting faster."],
      s: ["Write a one-page incident plan with roles and contacts, and investigate every complaint that could be food safety related.",
          "Run a timed mock withdrawal, record the gaps, fix them and confirm the fixes held.",
          "Rehearse harder scenarios across shifts and channels, including coordination with suppliers and authorities.",
          "Show improving response times over repeated exercises and no repeat incidents from the same cause."] },

    { id: "2.1", t: "Clear nutrition and allergen information", k: 1,
      q: "Can guests get accurate allergen and nutrition information before they order?",
      o: ["Not reliably. Claims may be out of date and staff can't confirm answers.",
          "Some menus or apps show it, but changes and delivery platforms aren't always updated.",
          "Most items and channels show accurate information backed by recipe records.",
          "Information stays accurate through frequent changes, and we test the guest experience."],
      s: ["Calculate allergen and nutrition information for your core menu from recipe records and show it before ordering.",
          "Add an approval step so recipe and supplier changes update every menu, screen and delivery platform.",
          "Mystery-check the guest experience, review errors and complaints, and fix their causes.",
          "Keep information accurate across all channels as the menu changes, and keep testing it."] },
    { id: "2.2", t: "Healthier menu choices and uptake", k: 1,
      q: "How do you define and track healthier choices on your menu?",
      o: ["Items are called healthy without clear criteria or data.",
          "Some healthier dishes meet criteria, but coverage and share aren't clearly counted.",
          "We have written criteria, substantiated dishes and a clear share of menu items, with sales tracked where possible.",
          "Healthier choices span most sections, and the share guests actually choose keeps rising."],
      s: ["Write down what counts as a healthier dish for your operation and check your current menu against it.",
          "Count qualifying items against a clear denominator and start tracking their share of sales.",
          "Use uptake data to shape new dishes and make healthier options more appealing across more sections.",
          "Show the share of healthier choices ordered, not only offered, rising over several menu cycles."] },
    { id: "2.3", t: "Reducing salt, sugar and trans fat", k: 0,
      q: "Have you measured and reduced salt, sugar or trans fat in your recipes?",
      o: ["Not measured, and any claims have no baseline.",
          "A few recipes were reviewed, but targets and results are unclear.",
          "Key dishes have baselines and benchmarks, with documented reductions and taste checks.",
          "High-impact recipes are prioritised, changes are scaled and results hold over menu cycles."],
      s: ["Pick your highest-volume dishes, calculate their salt, sugar and fat today and choose a benchmark.",
          "Set targets, reformulate and record before-and-after values alongside safety and taste checks.",
          "Prioritise dishes with the biggest nutrition and sales impact, and scale the changes that worked.",
          "Confirm reductions over repeated menu cycles and correct any drop in quality or uptake."] },
    { id: "2.4", t: "Healthy eating outreach and partnerships", k: 0,
      q: "Do you encourage healthier eating beyond the menu itself?",
      o: ["No, or only through claims on the menu.",
          "Occasional campaigns, measured by materials handed out.",
          "Regular activities or partnerships reach guests, and we measure participation and response.",
          "Ongoing partnerships with health or community partners show repeated reach and real outcomes."],
      s: ["Choose one audience and one healthy-eating message, and plan a simple activity that goes beyond the menu.",
          "Partner with a credible health or community organisation and measure reach and guest response.",
          "Use the results to refine activities, and track outcomes beyond the healthy menu offer.",
          "Show repeated reach and behaviour change over several periods."] },

    { id: "3.1", t: "Sustainability management and targets", k: 1,
      q: "How is sustainability managed at this outlet?",
      o: ["Isolated or promotional activities, with no owner or measurable targets.",
          "Some policies or targets exist, but data are patchy and don't drive decisions.",
          "Owners, site-level targets and comparable results are reviewed by management.",
          "It shapes most decisions, results improve over periods and they're independently certified or verified."],
      s: ["Name a sustainability owner for this outlet and set two or three measurable site-level targets.",
          "Collect monthly data against each target and review it with management, recording actions and setbacks.",
          "Certify your environmental management or have your site results independently verified, and adjust targets using results.",
          "Show credible progress over several periods and keep the independent verification current."] },
    { id: "3.2", t: "Sustainable sourcing and verified origin", k: 0,
      q: "How do you back up local or sustainable sourcing claims?",
      o: ["We describe sourcing as local or sustainable without verifying origin or measuring share.",
          "We have some supplier declarations, but checks are limited and the share of purchases isn't clear.",
          "Documented criteria, verified supplier claims and a calculated share of purchases.",
          "Verified origin and impact data guide most purchasing, with sustained improvement."],
      s: ["List your main purchases and record their origin from supplier declarations.",
          "Verify the key claims and calculate the local or sustainable share against total spend or volume.",
          "Extend criteria to most purchasing categories and use impact data to guide decisions.",
          "Keep improving, and keep transport or carbon benefits out of your emissions figures to avoid counting them twice."] },
    { id: "3.3", t: "Saving energy and water", k: 0,
      q: "How do you measure and reduce energy and water use?",
      o: ["Not measured reliably, and savings are claimed without a baseline.",
          "Some bills or readings and projects, but no clear allocation to this outlet or per-cover measure.",
          "Major uses are measured against activity, with verified savings from changes.",
          "Savings hold through volume changes and are independently verified or certified."],
      s: ["Collect 12 months of energy and water bills or meter readings to set a baseline.",
          "Track use per cover or per meal, allocate shared hotel utilities and verify the saving from each change.",
          "Have savings independently verified or certify your energy management, and investigate any rise in use.",
          "Show savings that hold through changes in guest volume and service mix."] },
    { id: "3.4", t: "Reducing packaging and single-use plastics", k: 0,
      q: "How have you reduced packaging and single-use plastics?",
      o: ["We don't know how much we use.",
          "Some items were replaced, but quantities and the baseline are incomplete.",
          "High-volume items are measured, alternatives are tested for food safety and savings are reported.",
          "Most avoidable single-use items are addressed, with strong results over repeated periods."],
      s: ["Count the packaging and single-use items you buy each month to set a baseline.",
          "Measure the reduction from each change and check alternatives against local recycling options.",
          "Tackle the remaining items through redesign or reuse, protecting food safety and accessibility.",
          "Keep results strong over repeated periods, accounting for contamination and product waste."] },
    { id: "3.5", t: "Preventing and redirecting food waste", k: 1,
      q: "How do you measure and prevent food waste?",
      o: ["Food waste isn't measured or separated by source.",
          "Some data or donations, but preparation loss and plate waste aren't distinguished.",
          "Main waste streams are measured per cover, prevention comes first, then safe donation.",
          "Avoidable waste falls steadily over service cycles, adjusted for guest volume."],
      s: ["Weigh food waste daily for a month, split into preparation loss, spoilage and plate waste.",
          "Find out why edible food is wasted, change forecasting, prep or portions, then set up safe donation for the rest.",
          "Adjust results for guest volume and menu mix, verify donation partners and act on any rebound.",
          "Keep reducing avoidable waste, and measure prevention separately from diversion."] },
    { id: "3.6", t: "Climate action and carbon emissions", k: 0,
      q: "How do you measure and reduce your carbon emissions?",
      o: ["Claims only, with no defined boundary or credible data.",
          "Some estimates and projects, but sources and baselines shift.",
          "Main energy and fuel emissions are measured, with a baseline, targets and comparable results.",
          "A consistent boundary, sustained reductions and an independently verified inventory."],
      s: ["Define what your emissions figure covers and gather 12 months of electricity and fuel data.",
          "Set a baseline with consistent factors, link targets to specific actions and track the results.",
          "Have your inventory and reduction claims independently verified, and explain any overlap with sourcing or waste.",
          "Show sustained reductions adjusted for operating changes."] },

    { id: "4.1", t: "Using data to prevent food safety problems", k: 1,
      q: "Can you show a time data helped you prevent a food safety problem?",
      o: ["We have records or dashboards, but no data-led decision we can point to.",
          "Some trends prompt action, but irregularly and without a baseline.",
          "Reliable data are reviewed routinely, and preventive actions are compared with a baseline.",
          "Key patterns are caught early, and data-led decisions repeatedly reduce problems."],
      s: ["Pick one food safety record you already keep and review its trend monthly against a clear action threshold.",
          "Document one data-led decision end to end: the trend, the action and the before-and-after result.",
          "Monitor more patterns in time to act, refine your thresholds and test your assumptions.",
          "Show repeated reductions in recurring problems across shifts or outlets."] },
    { id: "4.2", t: "Ingredient traceability and test results", k: 1,
      q: "How fast can you trace an ingredient batch to the dishes you served?",
      o: ["We couldn't reliably link batches to the food served.",
          "Some links exist, but a test would be slow and leave gaps.",
          "Most ingredients trace through prep to sales, and a recent test logged time and quantities.",
          "We trace rapidly across channels and shifts, and repeated tests keep getting faster."],
      s: ["Record batch or lot numbers at receiving and link them to prep records for high-risk ingredients.",
          "Run a timed traceability test, reconcile quantities and close every gap you find.",
          "Test difficult scenarios across channels and shifts, and feed weaknesses into system changes.",
          "Show faster, more complete results over repeated tests."] },
    { id: "4.3", t: "Customer access to product information", k: 0,
      q: "How easily can guests find ingredient or source information?",
      o: ["There's little information, or it can't be linked to reliable records.",
          "Some is on menus or online, but coverage and updates vary by channel.",
          "Most products and channels show information backed by current records.",
          "Guests find accurate information in formats that suit them, and we test usability."],
      s: ["Publish ingredient and source information for your core items, linked to current records.",
          "Extend it to every channel and add an update check for menu or supplier changes.",
          "Test usability and accuracy with guests and act on their feedback.",
          "Show sustained improvements in informed choice and trust."] },
    { id: "4.4", t: "Live monitoring and response to alerts", k: 0,
      q: "Do sensors or digital alerts monitor your food safety conditions?",
      o: ["None where they'd help, or alerts aren't acted on.",
          "Some alerts, but limits, calibration and who responds are inconsistent.",
          "Key conditions have sensors, tested limits and named responders.",
          "Monitoring holds in busy service and breakdowns, and we analyse false alarms and delays."],
      s: ["Identify your critical temperature points and decide where a sensor or alert would add value.",
          "Set tested alert limits, calibrate sensors and name who responds on every shift.",
          "Analyse false alarms and response times, and protect digital records with access control and backups.",
          "Show sustained improvement in detection and response."] },
    { id: "4.5", t: "Testing and applying new ideas", k: 0,
      q: "How do you test and adopt new ideas?",
      o: ["Ideas aren't tested, and there's no baseline or decision.",
          "Some trials, but success measures are unclear and decisions aren't recorded.",
          "Ideas follow an intake process, and trials have a baseline, a result and a recorded decision.",
          "Disciplined tests, honest stop decisions and scaled changes that keep delivering."],
      s: ["Pick one problem, run a small trial with a baseline and record the result.",
          "Set up an idea intake routine and record a go, revise or stop decision for each trial.",
          "Build adopted changes into training and procedures, and measure results after wider use.",
          "Keep a pipeline of tested ideas with repeated, measurable impact."] },

    { id: "5.1", t: "Accessible service and inclusion", k: 1,
      q: "How accessible is your service for People of Determination and other guests with access needs?",
      o: ["Barriers haven't been examined, and staff have no reliable way to help.",
          "Some features or assistance, but it depends on who's on shift or which channel.",
          "Entry, ordering and information are accessible, staff know how to assist and feedback drives fixes.",
          "Most guests can use the service independently, and regular testing with users finds barriers early."],
      s: ["Walk the guest journey from arrival to payment and list the barriers for people with different access needs.",
          "Fix the priority barriers, offer accessible menus and ordering, and train staff to assist.",
          "Test regularly with users, including People of Determination, and track improvements from their feedback.",
          "Show repeated feedback confirming sustained improvements in access."] },
    { id: "5.2", t: "Community contribution and outcomes", k: 0,
      q: "How do you contribute to your community?",
      o: ["Ad hoc activities without a clear beneficiary or result.",
          "Some partnerships or donations, but reach and food handling are unevenly documented.",
          "Initiatives meet identified needs with partners, safe donation controls and measured outcomes.",
          "Sustained partnerships with clear goals and meaningful benefits over time."],
      s: ["Choose one community need linked to your operation and agree it with a partner.",
          "Document the purpose, reach and food safety controls for donations, and record beneficiaries.",
          "Review partner feedback and outcomes, and adapt the support accordingly.",
          "Show meaningful benefits over repeated periods rather than one-off events."] },
    { id: "5.3", t: "Employee engagement and voice", k: 0,
      q: "Can staff safely suggest improvements or raise concerns?",
      o: ["There's no credible channel, or managers don't respond.",
          "Some meetings or surveys, but access varies by shift and follow-up is weak.",
          "Most staff can raise issues safely, and managers report back and close actions.",
          "All staff get timely, fair responses, and their ideas drive sustained improvements."],
      s: ["Open a simple channel for suggestions and concerns, including a confidential option.",
          "Make it reachable on every shift and contract type, and report back on every decision.",
          "Show examples where staff input improved food safety, and repeat feedback to check trust.",
          "Show stronger trust and engagement over repeated measures."] },
    { id: "5.4", t: "Customer feedback and complaint resolution", k: 1,
      q: "How do you handle guest feedback and complaints?",
      o: ["Not captured consistently, and recurring causes aren't investigated.",
          "Some channels log and respond, but closure and root causes vary.",
          "One process across channels, with themes tracked, procedures changed and results checked.",
          "Feedback is an early signal, and patterns are fixed before they recur."],
      s: ["Log feedback and complaints from every channel in one register with a response target.",
          "Track response and closure times, and find the root cause of recurring complaints.",
          "Act on patterns early and verify that recurring issues are falling.",
          "Show sustained reductions in recurring complaints."] }

  m: [

    { id: "1.3", t: "Food fraud and food defence", k: 0,

    { id: "1.4", t: "Leadership, food safety culture and competence", k: 1,

    { id: "1.5", t: "Hygienic layout and environmental monitoring", k: 0,

    { id: "1.6", t: "Cleaning, sanitation and pest control", k: 0,

      s: ["Define cleaning methods for each piece of equipment, control chemicals and resolve open pest findings.",

    { id: "1.7", t: "Allergen control and product changeovers", k: 1,

          "We anticipate emerging material risks and verify supplier improvements."],
      s: ["Set risk-based supplier requirements, specifications and receiving checks.",

          "Adjust assurance as risks change, and work with suppliers on verified improvements.",
          "Show fewer repeat failures and stronger material performance."] },
    { id: "1.10", t: "Traceability, withdrawal and crisis response", k: 1,
      q: "How quickly and completely can you trace and withdraw a batch?",
      o: ["We can't reliably connect incoming lots, finished batches and customers.",
          "Records exist, but a test shows slow retrieval or unresolved quantities.",

          "We test challenging scenarios, and repeated exercises keep improving time and reconciliation."],
      s: ["Link incoming lots to finished batches and customers, and assign withdrawal responsibilities.",

  /* ---------- Scoring ---------- */
  function compute() {
    const c = cat(), f = c.fam, L = list();
    const pillars = [1, 2, 3, 4, 5].map((n) => {
      const items = L.filter((q) => pn(q) === n);
      const raw = items.reduce((a, q) => a + PTS[S.ans[q.id] || "U"], 0) / items.length;
      return { n, name: PILLARS[f][n - 1], short: PSHORT[f][n - 1], w: c.w[n - 1], raw, score: Math.round(raw), count: items.length };
    });
    const overallRaw = pillars.reduce((a, p) => a + (p.w * p.raw), 0) / 100;
    const overall = Math.round(overallRaw);
    const bi = bandIdx(overallRaw);
    const scored = L.map((q) => {
      const a = S.ans[q.id] || "U", p = pillars[pn(q) - 1];
      return { q, a, pts: PTS[a], gain: (90 - PTS[a]) * p.w / p.count, w: p.w };
    });
    const byId = (x, y) => x.q.id.localeCompare(y.q.id, undefined, { numeric: true });
    const N = 5;
    const ranked = scored.filter((x) => x.a !== "L").sort((x, y) => (y.gain - x.gain) || byId(x, y));
    const perPillar = {};
    let picks = [];
    ranked.forEach((x) => { const k = pn(x.q); if (picks.length < N && (perPillar[k] || 0) < 1) { picks.push(x); perPillar[k] = (perPillar[k] || 0) + 1; } });
    ranked.forEach((x) => { if (picks.length < N && picks.indexOf(x) === -1) picks.push(x); });
    picks.sort((x, y) => (y.gain - x.gain) || byId(x, y));
    let sustaining = false;
    if (!picks.length) { sustaining = true; picks = scored.slice().sort((x, y) => (y.w - x.w) || byId(x, y)).slice(0, 3); }
    const steps = picks.map((x) => ({ id: x.q.id, title: x.q.t, unsure: x.a === "U", text: x.q.s[x.a === "U" ? 0 : KEYS.indexOf(x.a)] }));
    const phases = sustaining
      ? [{ name: "Keep it up", when: "Through 2027", steps }]
      : [{ name: "Start now", when: "Next 90 days", steps: [] }, { name: "Build", when: "3 to 6 months", steps: [] }, { name: "Prove it", when: "Before you submit", steps: [] }];
    if (!sustaining) steps.forEach((s, i) => phases[i < 2 ? 0 : i < 4 ? 1 : 2].steps.push(s));
    if (S.gate !== "yes") phases[0].steps.unshift({ id: "A", title: "Consecutive A food safety ratings", text: GATE_STEP[S.gate] || GATE_STEP.unsure, unsure: S.gate === "unsure" });
    const strengths = scored.filter((x) => x.pts >= 65).sort((x, y) => (y.pts - x.pts) || (y.w - x.w) || byId(x, y)).slice(0, 3);
    return { pillars, overall, overallRaw, bi, phases, strengths, sustaining };
  }

  async function send(payload) {
    if (!isLive()) return "preview";
    const ctrl = typeof AbortController === "function" ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 9000) : null;
    try {
      await fetch(CONFIG.SUBMIT_URL, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), signal: ctrl ? ctrl.signal : undefined });
      return "sent";
    } catch (e) { return "failed"; }
    finally { if (timer) clearTimeout(timer); }
  }

    let i = 0;
    const tick = setInterval(() => { const t = $("#compLine"); if (!t) return clearInterval(tick); i = (i + 1) % lines.length; t.textContent = lines[i]; }, 620);
    const [res] = await Promise.all([send(assessmentPayload()), sleep(reduceMotion() ? 500 : 2100)]);
    clearInterval(tick);
    S.sent.a = res;
    if (S.screen === "computing") go("results");
  };

  after.results = (el, m) => {
    const R = S.R;
    const num = $("#scoreNum", el), fill = $("#rrFill", el), marker = $("#rrMarker", el);
    const finish = () => {
      $$(".p-bar i", el).forEach((i) => { i.style.width = i.dataset.s + "%"; });
      if (fill) fill.style.strokeDashoffset = String(100 - R.overallRaw);
      if (marker) marker.style.transform = `translateX(${(R.overallRaw * 3).toFixed(1)}px)`;
    };
    if (reduceMotion()) { finish(); if (num) num.textContent = R.overall; return; }
    setTimeout(() => {
      finish();
      const t0 = performance.now(), dur = 1400;
      const step = (t) => {
        const k = Math.min(1, (t - t0) / dur), e2 = 1 - Math.pow(1 - k, 3);
        if (num) num.textContent = Math.round(R.overall * e2);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, 420);
    if (R.bi === 3) setTimeout(() => burst(m, 22), 900);
    if (R.bi === 2) setTimeout(() => { if (S.screen === "results") setPose(m, "rest"); }, 4200);
  };

  after.done = (el, m) => {
    if (S.sent.r !== "failed") setTimeout(() => burst(m, 20), 500);
    setTimeout(() => { if (S.screen === "done") setPose(m, "open"); }, 3200);
  };

  /* ---------- Boot ---------- */
  blinkLoop();
  go("intro");
})();
</script>
